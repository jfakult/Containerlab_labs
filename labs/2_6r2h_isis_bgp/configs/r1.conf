frr version 8.4_git
frr defaults traditional
hostname r1
log stdout
no ipv6 forwarding
!
interface eth1
 ip address 10.0.12.0/31
 ip router isis 0
 isis network point-to-point
exit
!
interface eth2
 ip address 10.0.13.0/31
 ip router isis 0
 isis network point-to-point
exit
!
interface eth3
 ip address 10.255.1.1/30
exit
!
interface lo
 ip address 1.1.1.1/32
 ip router isis 0
 isis passive
exit
!
interface lo0
exit
!
router bgp 66001
 bgp router-id 1.1.1.1
 no bgp ebgp-requires-policy
 no bgp network import-check
 timers bgp 10 30
 neighbor 6.6.6.6 remote-as 66006
 neighbor 6.6.6.6 ebgp-multihop 255
 neighbor 6.6.6.6 update-source lo
 !
 address-family ipv4 unicast
  network 10.255.1.0/30
 exit-address-family
exit
!
router isis 0
 net 49.0001.0000.0000.0001.00
 log-adjacency-changes
exit
!
