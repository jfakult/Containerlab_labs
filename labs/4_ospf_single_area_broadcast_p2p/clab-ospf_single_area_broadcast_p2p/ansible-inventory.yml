all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    bridge:
      hosts:
        clab-ospf_single_area_broadcast_p2p-vlan10:
          ansible_host: 
    linux:
      hosts:
        clab-ospf_single_area_broadcast_p2p-ecr1:
          ansible_host: 172.20.21.2
        clab-ospf_single_area_broadcast_p2p-ecr2:
          ansible_host: 172.20.21.3
        clab-ospf_single_area_broadcast_p2p-h1:
          ansible_host: 172.20.21.8
        clab-ospf_single_area_broadcast_p2p-h2:
          ansible_host: 172.20.21.5
        clab-ospf_single_area_broadcast_p2p-hcr1:
          ansible_host: 172.20.21.4
        clab-ospf_single_area_broadcast_p2p-hcr2:
          ansible_host: 172.20.21.7
        clab-ospf_single_area_broadcast_p2p-rcr1:
          ansible_host: 172.20.21.6
        clab-ospf_single_area_broadcast_p2p-rcr2:
          ansible_host: 172.20.21.9