frr version 8.4_git
frr defaults traditional
hostname hcr1
log stdout
no ipv6 forwarding
!
interface eth0
 description MGMT
exit
!
interface eth1
 description VLAN10 - broadcast core
 ip address 10.0.10.3/24
 ip ospf area 0
exit
!
interface eth2
 description P2P link to Edge1
 ip address 10.0.0.0/31
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.255.255.3/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.255.3
exit
!
