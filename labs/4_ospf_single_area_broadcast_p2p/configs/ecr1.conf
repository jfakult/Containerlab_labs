frr version 8.4_git
frr defaults traditional
hostname ecr1
log stdout
no ipv6 forwarding
!
interface eth0
 description MGMT
exit
!
interface eth1
 description Up to HCR1
 ip address 10.0.0.1/31
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description Down to Host 1
 ip address 10.0.20.1/24
exit
!
interface lo
 ip address 10.255.255.5/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.255.5
 redistribute connected
exit
!
