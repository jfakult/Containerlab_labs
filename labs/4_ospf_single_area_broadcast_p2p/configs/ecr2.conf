frr version 8.4_git
frr defaults traditional
hostname ecr2
log stdout
no ipv6 forwarding
!
interface eth0
 description MGMT
exit
!
interface eth1
 description Up to HCR1
 ip address 10.0.0.3/31
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description Down to Host 2
 ip address 10.0.30.1/24
exit
!
interface lo
 ip address 10.255.255.6/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.255.6
 redistribute connected
exit
!
