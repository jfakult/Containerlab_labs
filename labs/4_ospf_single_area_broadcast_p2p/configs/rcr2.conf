frr version 8.4_git
frr defaults traditional
hostname rcr2
log stdout
no ipv6 forwarding
!
interface eth0
 description MGMT
exit
!
interface eth1
 description VLAN10 - broadcast core
 ip address 10.0.10.2/24
 ip ospf area 0
exit
!
interface lo
 ip address 10.255.255.2/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.255.2
exit
!
